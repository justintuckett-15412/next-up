name: Build Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
            echo "Using your release key."
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret, so this APK uses a temporary key and won't install over earlier builds."
          fi
      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          gradle assembleRelease --no-daemon --stacktrace
          "-PrepoSlug=${{ github.repository }}"
          "-PbuildNumber=${{ github.run_number }}"
          "-PcalFile=${{ vars.CAL_FILE }}"
      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk next-up.apk
          gh release create "build-${{ github.run_number }}" next-up.apk \
            --title "Next Up build ${{ github.run_number }}" \
            --notes "On your phone, tap next-up.apk below to download, then open it to install." \
            --latest
